name: Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies & Build Server
      run: |
        cd server
        npm install
        npm run build

    - name: Install dependencies & Build Client
      run: |
        cd client
        npm install
        npm run build
      env:
        VITE_API_URL: ${{ secrets.VITE_API_URL }}

