services:
  # Base de datos (MongoDB Atlas es recomendado, pero si quieres una interna en Render usa esto como referencia)
  # Para producción se recomienda MongoDB Atlas.

  # Back-end: InventoryPro Server
  - type: web
    name: inventory-pro-server
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Debes configurarlo en el dashboard de Render
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        fromService:
          type: static
          name: inventory-pro-client
          property: url

  # Front-end: InventoryPro Client
  - type: static
    name: inventory-pro-client
    env: static
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: ${inventory-pro-server.url}/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
